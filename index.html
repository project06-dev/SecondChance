<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu</title>
    <!-- Font Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* --- GLOBAL & BACKGROUND --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden; 
            background: linear-gradient(135deg, #ffd1dc 0%, #b5e8f7 50%, #ffb6c1 100%);
            touch-action: none; 
        }

        /* --- HALAMAN INTRO (SURAT) --- */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #b5e8f7 0%, #ffd1dc 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: grab;
        }
        #intro-screen:active { cursor: grabbing; }

        /* --- DESAIN AMPLOP REALISTIS --- */
        .envelope-container {
            position: relative;
            width: 320px;
            height: 200px;
            animation: floatEnvelope 3s ease-in-out infinite;
            z-index: 10;
            perspective: 1200px;
        }

        @keyframes floatEnvelope {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Bagian Belakang Amplop */
        .env-back {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fdb3c0;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            z-index: 1;
        }

        /* Kertas Surat (Di dalam Amplop) */
        .env-paper {
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            background: #ffffff;
            border-radius: 8px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            background-image: repeating-linear-gradient(transparent, transparent 28px, rgba(173, 216, 230, 0.5) 28px, rgba(173, 216, 230, 0.5) 29px);
            background-position: 0 10px;
        }
        .env-paper.up {
            transform: translateY(-80px);
        }
        
        .paper-text {
            color: #ff8da1;
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }
        .paper-heart {
            font-size: 35px;
            animation: pulseIntro 1.5s infinite;
        }
        @keyframes pulseIntro {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* Lipatan Depan Amplop */
        .env-front {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }
        .env-front svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0px -3px 4px rgba(0,0,0,0.08));
        }

        /* Penutup Atas Amplop (Flap) */
        .env-flap {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 135px;
            z-index: 4;
            transform-origin: top center;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.3s;
            pointer-events: none;
        }
        .env-flap svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0px 4px 5px rgba(0,0,0,0.15));
        }
        .env-flap.open {
            transform: rotateX(180deg);
            z-index: 1; 
        }

        /* Stempel Lilin (Wax Seal) */
        .wax-seal {
            position: absolute;
            bottom: -5px; 
            left: 50%;
            transform: translateX(-50%);
            width: 50px; height: 50px;
            background: radial-gradient(circle, #ff4d6d 40%, #c9184a 100%);
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2), inset 0 3px 5px rgba(255,255,255,0.4);
            display: flex; justify-content: center; align-items: center;
            z-index: 5;
            transition: opacity 0.4s ease;
        }
        .env-flap.open .wax-seal { opacity: 0; }

        /* Indikator Swipe (Usap) */
        .swipe-indicator {
            margin-top: 50px;
            display: flex; flex-direction: column; align-items: center;
            color: #4a6572;
            animation: floatUp 2s infinite;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .swipe-arrows {
            transform: rotate(-90deg); 
            font-size: 22px; font-weight: bold; letter-spacing: -2px;
            margin-bottom: 5px; color: #ff8da1;
        }
        .swipe-text { font-size: 18px; font-weight: 700; text-shadow: 0px 2px 5px rgba(255,255,255,0.8); }
        @keyframes floatUp { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        /* --- ANIMASI BUNGA MENYEMBUR DARI DALAM SURAT --- */
        .flower-particle {
            position: fixed;
            top: 55%; left: 50%; 
            /* Ukuran dasar bunga diperbesar agar hasilnya lebih besar di layar */
            width: 70px; height: 70px;
            margin-top: -35px; margin-left: -35px;
            z-index: 1005; 
            opacity: 0;
            pointer-events: none;
            /* Durasi diperpanjang agar putaran dan pergerakan terlihat jelas */
            animation: burstOut 2.2s cubic-bezier(0.15, 0.9, 0.3, 1) forwards;
        }
        
        @keyframes burstOut {
            0% { 
                transform: scale(0.1) translate(0, 50px) rotate(0deg); 
                opacity: 1; 
            }
            70% { 
                opacity: 1; 
            }
            100% { 
                /* Scale sangat besar, pergerakan melebar, dan rotasi berganda */
                transform: scale(var(--scale)) translate(var(--tx), var(--ty)) rotate(var(--rot)); 
                opacity: 0; 
            }
        }

        /* --- HALAMAN UTAMA (SCRAPBOOK) --- */
        .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.95);
            background-image: radial-gradient(#add8e6 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            padding: 50px 30px 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(173, 216, 230, 0.5), 0 5px 15px rgba(0,0,0,0.05);
            
            width: 90%; max-width: 400px; min-height: 480px;
            z-index: 10; position: relative;
            
            opacity: 0; transform: scale(0.9); pointer-events: none;
            transition: opacity 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .container.show { opacity: 1; transform: scale(1); pointer-events: auto; }

        .container::before {
            content: ''; position: absolute; top: -20px; left: 50%;
            transform: translateX(-50%) rotate(-3deg);
            width: 130px; height: 38px;
            background: rgba(173, 216, 230, 0.85); 
            backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 3px dashed rgba(255, 255, 255, 0.9); border-right: 3px dashed rgba(255, 255, 255, 0.9);
            box-shadow: 1px 4px 10px rgba(0,0,0,0.08); z-index: 20;
        }

        h1 { color: #4a6572; font-size: 24px; font-weight: 700; margin-bottom: 30px; line-height: 1.4; }

        /* --- AREA TOMBOL --- */
        .buttons { position: relative; width: 250px; height: 50px; margin: 20px auto 0; }
        button {
            width: 110px; height: 45px; font-size: 18px; border: none; border-radius: 50px;
            cursor: pointer; font-weight: 700; font-family: 'Quicksand', sans-serif;
            box-sizing: border-box; transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        button:active { transform: translateY(4px) !important; }
        
        #btn-mau { background-color: #ff9a9e; color: white; position: absolute; left: 0; box-shadow: 0 6px 0px #ff6b81, 0 10px 20px rgba(255,107,129,0.3); z-index: 5; }
        #btn-mau:active { box-shadow: 0 2px 0px #ff6b81, 0 5px 10px rgba(255,107,129,0.3) !important; }
        #btn-gak { background-color: #e0f7fa; color: #4a6572; position: absolute; right: 0; box-shadow: 0 6px 0px #add8e6, 0 10px 20px rgba(173,216,230,0.4); z-index: 9999; }
        #btn-gak:active { box-shadow: 0 2px 0px #add8e6, 0 5px 10px rgba(173,216,230,0.4) !important; }

        /* --- ANIMASI KARAKTER --- */
        @keyframes ngambang { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
        .karakter-malu { animation: ngambang 2.5s ease-in-out infinite; margin-bottom: 10px; }
        @keyframes kedip { 0%, 96%, 98% { transform: scaleY(1); } 97%, 99% { transform: scaleY(0.1); } 100% { transform: scaleY(1); } }
        .mata { transform-origin: center; animation: kedip 4s infinite; }
        .pipi { transition: fill 0.3s ease, opacity 0.3s ease; }
        @keyframes loncat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-25px); } }
        .karakter-senang { animation: loncat 0.6s ease-in-out infinite; margin-bottom: 10px; }
        @keyframes heartbeat { 0%, 28%, 70% { transform: scale(1); } 14%, 42% { transform: scale(1.15); } }
        .text-yes { color: #ff6b81; margin-top: 15px; font-size: 26px; animation: heartbeat 1.5s infinite; }

        /* --- EFEK HUJAN & LATAR (BUNGA SVG) --- */
        .flower-drop { position: fixed; z-index: 20; animation: jatuhKeBawah linear infinite; pointer-events: none; }
        @keyframes jatuhKeBawah { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0.8; } }
        
        .flower-fountain { position: fixed; bottom: -30px; z-index: 25; pointer-events: none; animation: nyembur ease-out forwards; }
        @keyframes nyembur { 0% { transform: translate(-50%, 0) scale(0.5) rotate(0deg); opacity: 1; } 100% { transform: translate(calc(-50% + var(--geserX)), var(--geserY)) scale(1.2) rotate(var(--rotasi)); opacity: 0; } }
    </style>
</head>
<body>

    <!-- LAYER INTRO: SURAT REALISTIS -->
    <div id="intro-screen">
        <div class="envelope-container" id="amplop">
            <div class="env-back"></div>
            <div class="env-paper" id="paper">
                <p class="paper-text">Special for you...</p>
                <div class="paper-heart">🩵</div>
            </div>
            
            <div class="env-front">
                <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 0,0 L 160,110 L 320,0 Z" fill="none" />
                    <path d="M 0,0 L 160,110 L 0,200 Z" fill="#ffb3c6" />
                    <path d="M 320,0 L 160,110 L 320,200 Z" fill="#ffb3c6" />
                    <path d="M 0,200 L 160,120 L 320,200 Z" fill="#ff9a9e" />
                </svg>
            </div>

            <div class="env-flap" id="flap">
                <svg viewBox="0 0 320 135" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 0,0 L 160,130 L 320,0 Z" fill="#ff8da1" />
                </svg>
                <div class="wax-seal">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
            </div>
        </div>
        
        <div class="swipe-indicator" id="swipe-hint">
            <div class="swipe-arrows">»»»</div>
            <div class="swipe-text">Usap ke atas untuk membuka surat 💌</div>
        </div>
    </div>

    <!-- WADAH EFEK -->
    <div id="wadah-hujan-bunga"></div>

    <!-- LAYER MAIN CONTENT -->
    <div class="container" id="konten">
        <!-- Beruang Full Body SVG -->
        <svg width="180" height="216" viewBox="0 0 200 240" class="karakter-malu" xmlns="http://www.w3.org/2000/svg">
            <circle cx="55" cy="45" r="20" fill="#fca311"/>
            <circle cx="55" cy="45" r="12" fill="#ffb703"/>
            <circle cx="145" cy="45" r="20" fill="#fca311"/>
            <circle cx="145" cy="45" r="12" fill="#ffb703"/>
            <ellipse cx="70" cy="210" rx="20" ry="15" fill="#fca311"/>
            <ellipse cx="130" cy="210" rx="20" ry="15" fill="#fca311"/>
            <ellipse cx="100" cy="155" rx="55" ry="60" fill="#fca311"/>
            <ellipse cx="100" cy="160" rx="35" ry="45" fill="#ffb703"/>
            <circle cx="100" cy="95" r="65" fill="#fca311"/>
            <ellipse cx="60" cy="105" rx="14" ry="7" fill="#ffb3c6" opacity="0.9" class="pipi"/>
            <ellipse cx="140" cy="105" rx="14" ry="7" fill="#ffb3c6" opacity="0.9" class="pipi"/>
            <g class="mata">
                <circle cx="75" cy="85" r="10" fill="#14213d"/>
                <circle cx="78" cy="82" r="3" fill="white"/>
                <circle cx="125" cy="85" r="10" fill="#14213d"/>
                <circle cx="128" cy="82" r="3" fill="white"/>
            </g>
            <ellipse cx="100" cy="100" rx="8" ry="5" fill="#14213d"/>
            <path d="M 92 110 Q 100 118 108 110" fill="none" stroke="#14213d" stroke-width="3" stroke-linecap="round"/>
            <path d="M 55 140 Q 80 180 95 170" stroke="#fca311" stroke-width="18" stroke-linecap="round" fill="none"/>
            <path d="M 145 140 Q 120 180 105 170" stroke="#fca311" stroke-width="18" stroke-linecap="round" fill="none"/>
        </svg>
        
        <h1 id="judul">Hai, kamu mau nggak jadi pacarku? 🥺</h1>
        <div class="buttons">
            <button id="btn-mau" onmouseover="tersipu(true)" onmouseout="tersipu(false)" onclick="terima()">Mau!</button>
            <button id="btn-gak" onmouseover="lari(this)" onclick="lari(this)">Nggak</button>
        </div>
    </div>

    <script>
        // ==========================================
        // FUNGSI PEMBUAT BUNGA SVG
        // ==========================================
        function buatSVG_Bunga(warna) {
            return `
            <svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
               <g transform="translate(50,50)">
                 <path d="M 0,0 C 15,-20 15,-40 0,-45 C -15,-40 -15,-20 0,0" fill="${warna}" transform="rotate(0)" />
                 <path d="M 0,0 C 15,-20 15,-40 0,-45 C -15,-40 -15,-20 0,0" fill="${warna}" transform="rotate(72)" />
                 <path d="M 0,0 C 15,-20 15,-40 0,-45 C -15,-40 -15,-20 0,0" fill="${warna}" transform="rotate(144)" />
                 <path d="M 0,0 C 15,-20 15,-40 0,-45 C -15,-40 -15,-20 0,0" fill="${warna}" transform="rotate(216)" />
                 <path d="M 0,0 C 15,-20 15,-40 0,-45 C -15,-40 -15,-20 0,0" fill="${warna}" transform="rotate(288)" />
                 <circle cx="0" cy="0" r="8" fill="#ffe066" />
               </g>
            </svg>`;
        }
        
        const warnaBunga = ['#ffb6c1', '#ff9a9e', '#ffc0cb', '#add8e6', '#b5e8f7', '#ffffff'];

        // ==========================================
        // LOGIKA SWIPE UP SURAT & TRANSISI
        // ==========================================
        const introScreen = document.getElementById('intro-screen');
        const flap = document.getElementById('flap');
        const paper = document.getElementById('paper');
        const swipeHint = document.getElementById('swipe-hint');
        const mainContent = document.getElementById('konten');
        const wadahHujan = document.getElementById('wadah-hujan-bunga');
        
        let isOpened = false;
        let startY = 0;
        let isSwiping = false;

        introScreen.addEventListener('touchstart', e => { startY = e.touches[0].clientY; });
        introScreen.addEventListener('touchmove', e => {
            if(!isOpened && startY - e.touches[0].clientY > 50) prosesBukaSurat();
        });
        
        introScreen.addEventListener('mousedown', e => { isSwiping = true; startY = e.clientY; });
        document.addEventListener('mousemove', e => {
            if(isSwiping && !isOpened && startY - e.clientY > 50) prosesBukaSurat();
        });
        document.addEventListener('mouseup', () => { isSwiping = false; });

        function prosesBukaSurat() {
            isOpened = true;
            
            flap.classList.add('open');
            paper.classList.add('up');
            swipeHint.style.opacity = '0'; 
            
            setTimeout(() => {
                
                // JUMLAH BUNGA DITAMBAH JADI 100 AGAR PENUH
                for(let i = 0; i < 100; i++) {
                    let flower = document.createElement('div');
                    flower.classList.add('flower-particle');
                    
                    let warnaAcak = warnaBunga[Math.floor(Math.random() * warnaBunga.length)];
                    flower.innerHTML = buatSVG_Bunga(warnaAcak);
                    
                    // Jarak pancaran diperlebar agar memenuhi layar HP/Laptop
                    let angle = Math.random() * Math.PI * 2;
                    let distance = Math.random() * 800 + 200; 
                    let tx = Math.cos(angle) * distance + 'px';
                    let ty = Math.sin(angle) * distance + 'px';
                    
                    flower.style.setProperty('--tx', tx);
                    flower.style.setProperty('--ty', ty);
                    
                    // Ukuran random (diperbesar mulai dari 1x sampai 3.5x lipat)
                    flower.style.setProperty('--scale', Math.random() * 2.5 + 1);
                    
                    // Rotasi berputar ekstrim (720 derajat hingga 1440 derajat) ke kiri atau kanan
                    let putaran = (Math.random() * 720 + 720) * (Math.random() > 0.5 ? 1 : -1);
                    flower.style.setProperty('--rot', putaran + 'deg');
                    
                    wadahHujan.appendChild(flower);
                    
                    // Hilangkan setelah animasi selesai
                    setTimeout(() => { flower.remove(); }, 2500);
                }

                // Jeda diperlama agar animasi bunga berputar terlihat puas sebelum ganti halaman
                setTimeout(() => {
                    introScreen.style.opacity = '0';
                    mainContent.classList.add('show');
                    
                    setTimeout(() => {
                        introScreen.style.display = 'none'; 
                    }, 1000);
                    
                }, 1300); 

            }, 600); 
        }

        // ==========================================
        // LOGIKA KONTEN UTAMA
        // ==========================================
        function tersipu(isHover) {
            const pipi = document.querySelectorAll('.pipi');
            pipi.forEach(p => {
                if(isHover) { p.style.fill = '#ff6b81'; p.style.opacity = '1'; } 
                else { p.style.fill = '#ffb3c6'; p.style.opacity = '0.9'; }
            });
        }

        function lari(tombol) {
            tombol.style.position = 'fixed';
            tombol.style.margin = '0'; 
            
            const container = document.getElementById('konten');
            const rect = container.getBoundingClientRect();
            
            const lebarTombol = tombol.offsetWidth;
            const tinggiTombol = tombol.offsetHeight;
            
            const batasKiri = rect.left + 25;
            const batasKanan = rect.right - lebarTombol - 25;
            const batasAtas = rect.top + 25;
            const batasBawah = rect.bottom - tinggiTombol - 25;
            
            const posisiX = Math.floor(Math.random() * (batasKanan - batasKiri + 1)) + batasKiri;
            const posisiY = Math.floor(Math.random() * (batasBawah - batasAtas + 1)) + batasAtas;
            
            tombol.style.left = posisiX + 'px';
            tombol.style.top = posisiY + 'px';
        }

        function terima() {
            const konten = document.getElementById('konten');
            
            const beruangSenang = `
                <svg width="180" height="216" viewBox="0 0 200 240" class="karakter-senang" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="55" cy="45" r="20" fill="#fca311"/>
                    <circle cx="55" cy="45" r="12" fill="#ffb703"/>
                    <circle cx="145" cy="45" r="20" fill="#fca311"/>
                    <circle cx="145" cy="45" r="12" fill="#ffb703"/>
                    <ellipse cx="70" cy="210" rx="20" ry="15" fill="#fca311"/>
                    <ellipse cx="130" cy="210" rx="20" ry="15" fill="#fca311"/>
                    <ellipse cx="100" cy="155" rx="55" ry="60" fill="#fca311"/>
                    <ellipse cx="100" cy="160" rx="35" ry="45" fill="#ffb703"/>
                    <circle cx="100" cy="95" r="65" fill="#fca311"/>
                    <ellipse cx="60" cy="105" rx="14" ry="7" fill="#ff6b81" opacity="0.9"/>
                    <ellipse cx="140" cy="105" rx="14" ry="7" fill="#ff6b81" opacity="0.9"/>
                    <path d="M 62 85 Q 75 72 88 85" fill="none" stroke="#14213d" stroke-width="6" stroke-linecap="round"/>
                    <path d="M 112 85 Q 125 72 138 85" fill="none" stroke="#14213d" stroke-width="6" stroke-linecap="round"/>
                    <ellipse cx="100" cy="100" rx="8" ry="5" fill="#14213d"/>
                    <path d="M 90 108 Q 100 135 110 108 Z" fill="#ff7eb3" stroke="#14213d" stroke-width="3" stroke-linejoin="round"/>
                    <path d="M100,195 l-6,-5 c-20,-17 -34,-29 -34,-43 c0,-11 9,-20 20,-20 c6,0 12,3 17,7 c5,-4 11,-7 17,-7 c11,0 20,9 20,20 c0,14 -14,26 -34,43 l-6,5 z" fill="#ff7eb3" stroke="#ffffff" stroke-width="4"/>
                    <path d="M 55 140 Q 75 160 85 155" stroke="#fca311" stroke-width="18" stroke-linecap="round" fill="none"/>
                    <path d="M 145 140 Q 125 160 115 155" stroke="#fca311" stroke-width="18" stroke-linecap="round" fill="none"/>
                </svg>
            `;

            konten.style.backgroundImage = 'none';
            konten.innerHTML = `
                ${beruangSenang}
                <h1 class="text-yes">Yeayyy! Makasih yaa sayang! 🩵🩷</h1>
            `;

            setInterval(buatHujanBunga, 200);
            buatSemburanBungaBawah();
            setInterval(buatSemburanBungaBawah, 3000);
        }

        // --- FUNGSI HUJAN & SEMBURAN ---
        function buatHujanBunga() {
            let flower = document.createElement('div');
            let warnaAcak = warnaBunga[Math.floor(Math.random() * warnaBunga.length)];
            
            flower.innerHTML = buatSVG_Bunga(warnaAcak);
            flower.classList.add('flower-drop');
            flower.style.left = Math.random() * 100 + 'vw';
            
            let size = Math.random() * 20 + 20; 
            flower.style.width = size + 'px';
            flower.style.height = size + 'px';
            flower.style.animationDuration = Math.random() * 2 + 3 + 's';
            
            wadahHujan.appendChild(flower);
            setTimeout(() => { flower.remove(); }, 5000);
        }

        function buatSemburanBungaBawah() {
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    let flower = document.createElement('div');
                    let warnaAcak = warnaBunga[Math.floor(Math.random() * warnaBunga.length)];
                    
                    flower.innerHTML = buatSVG_Bunga(warnaAcak);
                    flower.classList.add('flower-fountain');
                    
                    flower.style.left = '50%';
                    let geserX = (Math.random() - 0.5) * 80 + 'vw';
                    let geserY = -(Math.random() * 60 + 40) + 'vh';
                    let rotasi = (Math.random() - 0.5) * 360 + 'deg';
                    
                    flower.style.setProperty('--geserX', geserX);
                    flower.style.setProperty('--geserY', geserY);
                    flower.style.setProperty('--rotasi', rotasi);
                    
                    let size = Math.random() * 20 + 15;
                    flower.style.width = size + 'px';
                    flower.style.height = size + 'px';
                    flower.style.animationDuration = Math.random() * 1 + 2 + 's';
                    
                    wadahHujan.appendChild(flower);
                    setTimeout(() => { flower.remove(); }, 3000);
                }, i * 20); 
            }
        }
    </script>
</body>
